name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover tests -v
      - name: The page must stay ES5 (Safari 9 / iOS 9)
        run: |
          python3 tools/extract_js.py > /tmp/frame.js
          npx --yes es-check@7 es5 /tmp/frame.js
      - name: The image builds
        run: docker build -t immich-legacy-frame .
